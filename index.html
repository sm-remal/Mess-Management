<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mess Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-pattern"></div>

  <div class="container">

    <!-- Header -->
    <header class="app-header">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M3 12h18M3 18h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Mess Calculator</h1>
        <p>Track meals, costs & settle balances</p>
      </div>
    </header>

    <!-- Meta Info Bar -->
    <div class="meta-bar">
      <div class="meta-field">
        <label for="metaName">Mess Name</label>
        <input type="text" id="metaName" placeholder="Enter Mess Name">
      </div>
      <div class="meta-field meta-field--sm">
        <label for="metaMonth">Month</label>
        <select id="metaMonth">
          <option>January</option><option>February</option><option>March</option>
          <option selected>April</option><option>May</option><option>June</option>
          <option>July</option><option>August</option><option>September</option>
          <option>October</option><option>November</option><option>December</option>
        </select>
      </div>
      <div class="meta-field meta-field--xs">
        <label for="metaYear">Year</label>
        <input type="number" id="metaYear" value="2026" min="2000" max="2100">
      </div>
    </div>

    <!-- Table Section -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Members</span>
        <span class="member-count" id="memberCount">3 members</span>
      </div>
      <div class="table-scroll">
        <table class="main-table">
          <thead>
            <tr>
              <th class="col-sn">#</th>
              <th class="col-name">Member Name</th>
              <th class="col-meal">Meal Count</th>
              <th class="col-bazar">Bazar Cost (৳)</th>
              <th class="col-del"></th>
            </tr>
          </thead>
          <tbody id="memberBody">
            <tr>
              <td class="col-sn sn-cell">1</td>
              <td><input class="inputName" type="text" placeholder="Enter Your Name"></td>
              <td><input class="inputMeal" type="number" placeholder="00" min="0" step="0.5"></td>
              <td><input class="inputBazar" type="number" placeholder="00.00" min="0" step="0.01"></td>
              <td><button class="del-btn" onclick="delRow(this)" title="Remove member" aria-label="Remove">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button></td>
            </tr>
            <tr>
              <td class="col-sn sn-cell">2</td>
              <td><input class="inputName" type="text" placeholder="Enter Your Name"></td>
              <td><input class="inputMeal" type="number" placeholder="00" min="0" step="0.5"></td>
              <td><input class="inputBazar" type="number" placeholder="00.00" min="0" step="0.01"></td>
              <td><button class="del-btn" onclick="delRow(this)" title="Remove member" aria-label="Remove">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button></td>
            </tr>
            <tr>
              <td class="col-sn sn-cell">3</td>
              <td><input class="inputName" type="text" placeholder="Enter Your Name"></td>
              <td><input class="inputMeal" type="number" placeholder="00" min="0" step="0.5"></td>
              <td><input class="inputBazar" type="number" placeholder="00.00" min="0" step="0.01"></td>
              <td><button class="del-btn" onclick="delRow(this)" title="Remove member" aria-label="Remove">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Action Buttons -->
      <div class="card-footer">
        <button class="btn btn-add" onclick="addRow()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          Add Member
        </button>
        <div class="btn-group-right">
          <button class="btn btn-reset" onclick="resetAll()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 106-6H5M2 5v3h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Reset
          </button>
          <button class="btn btn-calc" onclick="calculate()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 8h6M5 5.5h3M5 10.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Calculate
          </button>
        </div>
      </div>
    </div>

    <!-- Error -->
    <div class="error-box" id="errorBox" role="alert"></div>

    <!-- Results -->
    <div class="results-section" id="resultsSection">

      <div class="results-header">
        <div>
          <div class="results-tag">Result</div>
          <h2 class="results-title" id="resultsTitle"></h2>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="summary-grid" id="summaryGrid"></div>

      <!-- Breakdown Table -->
      <div class="card" style="margin-top:1.5rem;">
        <div class="card-header">
          <span class="card-title">Member Breakdown</span>
        </div>
        <div class="table-scroll">
          <table class="res-table">
            <thead>
              <tr>
                <th>Member</th>
                <th>Meals</th>
                <th>Bazar (৳)</th>
                <th>Meal Cost (৳)</th>
                <th>Balance (৳)</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
